# Netlify configuration for The Ground Narrative
# Optimized to minimize serverless compute credit usage

[build]
  command = "npm run build"
  publish = ".next"

# Use the Next.js runtime plugin (required for ISR + SSR on Netlify)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache static assets aggressively on the CDN for 1 year
# (these are hashed filenames so it's always safe)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache public assets (images, fonts, icons) for 7 days
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
